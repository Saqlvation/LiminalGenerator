<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal generator</title>
<style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* makes the elements stack on top of each other instead of side by side */
            height: 100vh;
            margin: 0;
        }
/* canvas style ; necessary to prevent the img from being too big and breaking the layout */
        canvas { 
            max-width: 80%;
            max-height: 60vh;
        }
/* style for the file input, the standard one looks a bit bad. */
        input[type="file"] {
            margin-top: 20px;
            padding: 10px;
            background-color: #333333;
            color: #ffffff;
            cursor: pointer;
        }
 /* hover effect that changes the background color so it "highlights" when the cursor goes over it */
            input[type="file"]:hover { 
            background-color: #555555;
        }

        
    </style>
</head>
<body>
    <h1>Liminal generator</h1>
    <p> Upload an image to transform it into ur own dream</p>
<!-- This is a dropdown menu for selecting image presets all do a different thing-->
    <select id="presetSelect" style="margin-top: 15px; padding: 10px; background-color: #333; color: #fff; border: none; cursor: pointer;">
    <option value="backrooms">Backrooms</option>
    <option value="analog">Analog</option>
    <option value="dreamcore">Dreamcore</option>
    </select>

    
    <input type="file" id="imageInput" accept="image/*">
    <canvas id="canvas" style="display:none;"></canvas> <!-- need display set to none just so we can change it later on, makes the page look better -->
    <button id="downloadbtn" style="display:none; margin-top: 20px; padding: 10px; background-color: #333333; color: #ffffff; cursor: pointer;">Download</button>

</body>

<script>
     // simply applies a yellow gradiant remembering that yellow is (255, 255, 0) in RGB
    function applyYellowGradiant(imagedata) {
        const data = imagedata.data;
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const gray = (r + g + b) / 3;
            data[i] = r + 50; // Increase red
            data[i + 1] = g + 50; // Increase green
            data[i + 2] = b; // Keep blue the same 
        }

    }
// desatuate the image using lerp to give that washed out look.(lerp not larp btw.)
    function desaturate(imagedata) { 
        const data = imagedata.data;
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const gray = (r + g + b) / 3;
            data[i] = r + (gray - r) * 0.5;
            data[i + 1] = g + (gray - g) * 0.5;
            data[i + 2] = b + (gray - b) * 0.5;
        }

    }
    // adds a grain effect(or noise) to the image making it seem more analog horror like.
    function addGrain(imagedata) {
        const data = imagedata.data;
        let maxGrain = 50; // increase this value for more grain
        let minGrain = -50; // increase this value for more grain
            for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const grain = Math.random() * (maxGrain - minGrain) + minGrain; // random grain value between min and max
            data[i] = r + grain;
            data[i + 1] = g + grain;
            data[i + 2] = b + grain;
        }

    }
    // makes everything much darker making sure every shadow is more pronounced
    function contrastFix(imagedata) {
            const data = imagedata.data;
            for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            data[i] = 30 + (r / 255) * (220 - 30);
            data[i + 1] = 30 + (g / 255) * (220 - 30);
            data[i + 2] = 30 + (b / 255) * (220 - 30);
        }
    }
// function that appliest a pinkgradiant to the image so i can implement the dreamcore.
    function applyPinkGradiant(imagedata) {
        const data = imagedata.data
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            data[i] = r + 40; 
            data[i + 1] = g; // we keep green.
            data[i + 2] = b + 40; 

        }
    }







    // canvas elements and event listener for the file input
    const input = document.getElementById('imageInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let lastImagedata = null; 


    const presets = {
    backrooms: (imagedata) => {
        desaturate(imagedata);
        applyYellowGradiant(imagedata);
        addGrain(imagedata);
        contrastFix(imagedata);
    },
    analog: (imagedata) => {
        desaturate(imagedata);
        addGrain(imagedata);
        addGrain(imagedata);
        contrastFix(imagedata);
        
    },
    dreamcore: (imagedata) => {
        applyPinkGradiant(imagedata);
        desaturate(imagedata);
        addGrain(imagedata);
    }
    };

    input.addEventListener('change', function(event) {
        const file = event.target.files[0];
        const img = new Image();
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            lastImage = img; //we save the original image data 
            const imagedata = ctx.getImageData(0, 0, canvas.width, canvas.height);
            // appliest the preset by taking the value inside the menu
            const preset = document.getElementById('presetSelect').value;
            presets[preset](imagedata); // applies it 
            ctx.putImageData(imagedata, 0, 0);
            canvas.style.display = 'block'; // need this otherwise the canvas does not show up D:
            // start of download button instructions
            const btn = document.getElementById('downloadbtn');
            btn.style.display = 'block';
            btn.onclick = function() {
                const link = document.createElement('a'); // creates a link element to download the image
                link.download = 'liminal_image.png'; // name of the file downloaded
                link.href = canvas.toDataURL(); 
                link.click(); // triggers the download
            }

        };
        img.src = URL.createObjectURL(file);
    });
    // this is an event listener where every time the user changes the preset the image gets reset so it does not get stuck.
    document.getElementById('presetSelect').addEventListener('change', function() {
        if(!lastImage) return; // if there is no image we do not want to do anything
        ctx.drawImage(lastImage, 0, 0); // we reset the image to the original one
        const imagedata = ctx.getImageData(0, 0, canvas.width, canvas.height);
        presets[this.value](imagedata); // this applies the new preset
        ctx.putImageData(imagedata, 0, 0); // changes the image
    
});


    </script>
